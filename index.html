<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CRLV Digital - Editor Profissional</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'FreeMonoCRLV';
            src: url('FreeMonoBold-full.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Painel Lateral */
        .sidebar {
            width: 460px;
            background: #f8fafc;
            box-shadow: 2px 0 18px rgba(15, 23, 42, 0.16);
            padding: 18px 18px 34px;
            overflow-y: auto;
            z-index: 10;
            box-sizing: border-box;
        }
        .sidebar-header {
            background: #0f3f74;
            color: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .sidebar-header h2 { margin: 0; font-size: 19px; }
        
        .dashboard-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .summary-card {
            background: #fff;
            border: 1px solid #dbe3ee;
            border-radius: 8px;
            padding: 10px;
        }
        .summary-card span { display: block; color: #64748b; font-size: 10px; font-weight: 700; }
        .summary-card strong { display: block; margin-top: 5px; color: #0f172a; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }

        .section-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
        .section-tab { border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; padding: 10px; cursor: pointer; font-weight: 800; }
        .section-tab.active { background: #0f3f74; color: #fff; }

        .field-panel { display: none; background: #fff; border: 1px solid #dbe3ee; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
        .field-panel.active { display: block; }
        .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 10px; font-weight: bold; color: #64748b; text-transform: uppercase; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-weight: bold; }

        .btn-save { width: 100%; background: #007bff; color: white; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Area do PDF */
        .preview-area { flex: 1; padding: 40px; display: flex; justify-content: center; background: #444; overflow-y: auto; }
        .document-container { position: relative; width: 794px; height: 1123px; background: #fff; }
        .pdf-bg { width: 100%; display: block; }
        .qr-clean-image { position: absolute; top: 120px; left: 218px; width: 150px; height: 150px; z-index: 8; background: #fff; }

        .overlay-text {
            position: absolute;
            color: #000;
            font-family: 'FreeMonoCRLV', monospace;
            font-weight: 700;
            font-size: 13.3px;
            pointer-events: none;
            white-space: nowrap;
        }

        @media print {
            body { display: block; background: white; }
            .sidebar { display: none !important; }
            .preview-area { padding: 0; background: none; }
            .document-container { box-shadow: none; }
            /* Garante que o fundo apareça no PDF */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>
    <div class="sidebar no-print">
        <div class="sidebar-header">
            <h2>Editor Profissional</h2>
        </div>
        
        <div class="dashboard-summary">
            <div class="summary-card"><span>Placa</span><strong id="sum-placa">JXW7175</strong></div>
            <div class="summary-card"><span>Exercício</span><strong id="sum-exercicio">2021</strong></div>
            <div class="summary-card"><span>Proprietário</span><strong id="sum-nome">JANDEILSON</strong></div>
        </div>

        <div class="section-tabs">
            <button class="section-tab active" onclick="showPanel('identificacao')">Dados</button>
            <button class="section-tab" onclick="showPanel('auto')">Auto Preencher</button>
        </div>

        <div id="form-fields">
            <section class="field-panel active" data-panel-content="identificacao">
                <div class="field-grid">
                    <div class="form-group"><label>Renavam</label><input type="text" oninput="updatePreview('renavam', this.value)" value="00936933747"></div>
                    <div class="form-group"><label>Placa</label><input type="text" oninput="updatePreview('placa', this.value)" value="JXW7175"></div>
                    <div class="form-group"><label>Exercício</label><input type="text" oninput="updatePreview('exercicio', this.value)" value="2021"></div>
                    <div class="form-group"><label>Nome</label><input type="text" oninput="updatePreview('nome', this.value)" value="JANDEILSON DA SILVA"></div>
                </div>
            </section>

            <section class="field-panel" data-panel-content="auto">
                <textarea id="autofill-text" rows="10" style="width:100%" placeholder="Cole os dados aqui..."></textarea>
                <button class="btn-save" onclick="applyAutoFill()">APLICAR DADOS</button>
            </section>

            <button class="btn-save" style="background:#28a745" onclick="window.print()">SALVAR PDF / IMPRIMIR</button>
        </div>
    </div>

    <div class="preview-area">
        <div class="document-container" id="printable">
            <img src="clean-bg.png" class="pdf-bg">
            <img src="qr-clean.png" class="qr-clean-image">
            
            <div id="pv-renavam" class="overlay-text" style="top: 134px; left: 41px;">00936933747</div>
            <div id="pv-placa" class="overlay-text" style="top: 169px; left: 41px;">JXW7175</div>
            <div id="pv-exercicio" class="overlay-text" style="top: 169px; left: 136px;">2021</div>
            <div id="pv-nome" class="overlay-text" style="top: 253px; left: 421px;">JANDEILSON DA SILVA</div>
        </div>
    </div>

    <script>
        function showPanel(panel) {
            document.querySelectorAll('.field-panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`[data-panel-content="${panel}"]`).classList.add('active');
        }

        function updatePreview(id, val) {
            const el = document.getElementById('pv-' + id);
            if (el) el.innerText = val.toUpperCase();
            const sum = document.getElementById('sum-' + id);
            if (sum) sum.innerText = val.toUpperCase();
        }

        function applyAutoFill() {
            const text = document.getElementById('autofill-text').value;
            // Lógica simples de extração
            const lines = text.split('\n');
            lines.forEach(line => {
                if(line.includes('PLACA:')) updatePreview('placa', line.split(':')[1].trim());
                if(line.includes('RENAVAM:')) updatePreview('renavam', line.split(':')[1].trim());
                if(line.includes('NOME:')) updatePreview('nome', line.split(':')[1].trim());
            });
            alert('Dados processados!');
        }

        // Sobrescreve a função de erro anterior
        window.print = function() {
            const originalTitle = document.title;
            document.title = "CRLV_Digital_" + document.getElementById('pv-placa').innerText;
            window.focus();
            const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
            if(!isChrome) alert("Use o Chrome ou Edge para salvar com a melhor qualidade.");
            window.print();
            document.title = originalTitle;
        };
    </script>
</body>
</html>
